# ENG-143 probe, throwaway branch, never merged. Question: can a job that does NOT use the
# github-pages environment (so no required reviewer, no main-only rule) publish GitHub Pages?
# Builds the same app as main. Started once by hand on this branch.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-without-environment:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4

  # Re-test after the fix: a branch job asking for the `release` environment (which holds the
  # site key) must be refused by the environment's main-only rule. Prints only the key's length.
  ask-for-release-key:
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: echo "key length ${#SITE_DEPLOY_KEY}"
