# Release to GitHub Pages. Started by hand only; never on merge.
# The github-pages environment's required reviewer (Rolando) is the
# release authorization gate (ENG-142). Each run releases exactly one commit:
# the one it was started on. That commit must be on main and must already have
# passed CI's `verified` check from GitHub Actions; a different commit needs a new
# run and a new approval.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
      REPO: ${{ github.repository }}
    steps:
      - name: Only main can be released
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::release runs only from main (got $GITHUB_REF)"
          exit 1
      - name: Require CI `verified` to have passed on this exact commit
        run: |
          # 15368 is the GitHub Actions app: a status with the same name from anything else does not count.
          ok=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=verified&per_page=100" \
            --jq '[.check_runs[] | select(.app.id == 15368 and .conclusion == "success")] | length')
          if [ "$ok" -lt 1 ]; then
            echo "::error::commit $SHA has no successful 'verified' check from GitHub Actions"
            exit 1
          fi
      - name: Show what is being released
        run: |
          {
            echo "### Releasing commit \`$SHA\`"
            echo ""
            echo "Approving the github-pages deployment releases exactly this commit."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
